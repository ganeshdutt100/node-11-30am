<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form id="memberForm">
      <label for="">Enter your name : </label>
      <input type="text" id="name" /> <br />
      <br />

      <label>Plan : </label>
      <select name="plan" id="plan">
        <option value="Basic">Basic</option>
        <option value="VIP Plan">VIP Plan</option>
      </select>
      <br />
      <br />
      <input type="submit" />
    </form>
    <p id="message">loading...</p>

    <script>
      document
        .getElementById("memberForm")
        .addEventListener("submit", async function (event) {
          event.preventDefault();

          const memeberName = document.getElementById("name").value;
          const memberPlan = document.getElementById("plan").value;

          const response = await fetch("/api/members", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name: memeberName, plan: memberPlan }),
          });
          const result = await response.json();

          if (response.ok) {
            document.getElementById("message").innerText =
              "Member data save successfully";
            document.getElementById(memberForm).reset();
          }
        });
    </script>
  </body>
</html>
