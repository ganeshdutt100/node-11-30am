<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div>
      <h2>QR Code Generator</h2>
      <input
        type="text"
        id="urlInput"
        placeholder="Enter URL or text here..."
      />
      <button onclick="qrCodeFun()">Save QR Code</button>
      <p id="statusMessage">loading...</p>
    </div>

    <script>
      async function qrCodeFun() {
        const inputVal = document.querySelector("#urlInput").value;
        const statusMessage = document.querySelector("#statusMessage");

        try {
          const response = await fetch(
            `/qrCodeGen?text=${encodeURIComponent(inputVal)}`,
          );
          const data = await response.json();
          if (response.ok) {
            statusMessage.innerText = `${data.fileName}`;
          }
        } catch (err) {
          statusMessage.innerText = `Error`;
        }
      }
    </script>
  </body>
</html>
