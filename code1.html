<!doctype html>
<html lang="hi">
  <head>
    <style>
      /* Base reset */
      .tree,
      .tree ul {
        list-style: none;
        padding-left: 20px;
        margin: 0;
        position: relative;
      }

      .tree li {
        position: relative;
        padding-top: 5px;
        padding-bottom: 5px;
        padding-left: 20px;
        box-sizing: border-box;
      }

      /* Vertical connecting line */
      .tree li::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 0;
        height: 100%;
        border-left: 1px dashed #777;
      }

      /* Horizontal connecting line */
      .tree li::after {
        content: "";
        position: absolute;
        top: 16px;
        left: 0;
        width: 15px;
        height: 0;
        border-top: 1px dashed #777;
      }

      /* Last child par vertical line ko terminate karna */
      .tree li:last-child::before {
        height: 16px; /* Horizontal connector ke level par rukti hai */
      }

      /* Folder UI styling */
      details summary {
        cursor: pointer;
        font-weight: 600;
        user-select: none;
        outline: none;
      }
    </style>
  </head>
  <body>
    <ul class="tree">
      <li>
        <details open>
          <summary>Root Folder</summary>
          <ul>
            <li>
              <details>
                <summary>Subfolder 1</summary>
                <ul>
                  <li>File 1.1</li>
                  <li>File 1.2</li>
                </ul>
              </details>
            </li>
            <li>
              <details>
                <summary>Subfolder 2</summary>
                <ul>
                  <li>File 2.1</li>
                  <li>
                    <details>
                      <summary>Nested Deep Folder</summary>
                      <ul>
                        <li>Deep File A</li>
                        <li>Deep File B</li>
                      </ul>
                    </details>
                  </li>
                </ul>
              </details>
            </li>
            <li>Standalone Root File</li>
          </ul>
        </details>
      </li>
    </ul>
  </body>
</html>
